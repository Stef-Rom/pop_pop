# Publie le jeu sur GitHub Pages à chaque push sur main.
# Nécessite : Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Le jeu compare ce fichier à celui chargé au démarrage pour proposer une mise à jour.
      - run: echo "${GITHUB_SHA}" > version.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
